name: TestNG Data-Driven Web Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run TestNG Selenium Web Automation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Run TestNG Data-Driven Tests with Maven (Headless Mode)
        run: ./mvnw clean test -Dheadless=true

      - name: Upload Extent HTML Reports & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestNG-Extent-Reports
          path: |
            test-output/*.html
            test-output/screenshots/*.png
          retention-days: 14
